; PlatformIO project for M5Stack PaperColor — Volumio "Now Playing" display
; Board: ESP32-S3R8 (16MB flash, 8MB octal PSRAM), 400x600 portrait Spectra 6 e-paper

[env:papercolor]
platform = espressif32
board = esp32-s3-devkitc-1    ; vanilla generic ESP32-S3 board def, avoids esp32s3box's camera-board-specific quirks
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi   ; quad flash + octal PSRAM, required for PaperColor per M5GFX

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0

lib_deps =
    m5stack/M5Unified @ ^0.2.21
    bblanchon/ArduinoJson @ ^7.0.4
